# tagherd type catalog: policy display name -> provider resource type.
#
# native_type  AWS: CloudFormation / AWS Config type. Azure: ARM type, lower case
#              as Resource Graph returns it. GCP: Cloud Asset Inventory asset type.
#              A type with no provider equivalent uses a descriptive placeholder
#              and is marked taggable: false.
# match        Attribute predicates, required when entries share a native type.
#              Attribute names are set by each discovery adapter (phase 3).
# taggable     true | false (NOT_TAGGABLE) | partial (scanned, never written).
# write_scope  org-management-account: writes must use the Organizations
#              management account's role.
# alias_of     The policy lists the same thing under two names; the alias shares
#              the named entry's classification.
# discovery    bulk (default): the cloud's inventory source (AWS Config, Azure
#              Resource Graph, Cloud Asset Inventory). list:<adapter>: a
#              per-service list call, for types the inventory does not record.
#              none: no adapter yet; reported as UNMAPPED_TYPE and listed by
#              `tagherd catalog --gaps`.
#
# Taggability marked false or partial is expected, to be confirmed in the pilot.

